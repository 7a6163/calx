---
name: Build gems

on:
  push:
    tags:
      - "v*"
      - "cross-gem/*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-data:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.fetch.outputs.result }}
    steps:
      - uses: oxidize-rb/actions/fetch-ci-data@v1
        id: fetch
        with:
          supported-ruby-platforms: |
            exclude: ["arm-linux", "x64-mingw32", "aarch64-mingw-ucrt"] # aarch64-mingw-ucrt: not supported by cross-gem yet
          stable-ruby-versions: |
            exclude: ["head"]

  source-gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Build gem
        run: bundle exec rake build

      - uses: actions/upload-artifact@v7
        with:
          name: gem-source
          path: pkg/*.gem

  cross-gem:
    name: Compile native gem for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci-data
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.ci-data.outputs.result).supported-ruby-platforms }}
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: ${{ join(fromJSON(needs.ci-data.outputs.result).stable-ruby-versions, ',') }}

      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  # Install the built platform gems the way users do and load them, so a gem
  # that cannot be required is never published.
  smoke-test:
    name: Install ${{ matrix.target.platform }} gem on Ruby ${{ matrix.ruby }}
    needs: cross-gem
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, platform: x86_64-linux }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { os: macos-latest, platform: arm64-darwin }
          - { os: windows-latest, platform: x64-mingw-ucrt }
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/download-artifact@v8
        with:
          name: gem-${{ matrix.target.platform }}
          path: pkg

      - name: Install and use the gem
        shell: bash
        run: |
          gem install pkg/*.gem --no-document
          ruby -e '
            require "calx"
            File.write("smoke.csv", "a,b\n1,2\n")
            abort "wrong rows" unless Calx.read("smoke.csv") == [%w[a b], %w[1 2]]
            puts "calx #{Calx::VERSION} OK on #{RUBY_PLATFORM}, Ruby #{RUBY_VERSION}"
          '

  # The musl gems, in the official Alpine Ruby images (as Alpine-based Docker
  # deployments use them). docker run rather than a job container: JavaScript
  # actions don't run in Alpine containers. 32-bit ARM runs under QEMU, so it
  # is tried on one Ruby only. (x86_64-darwin has no GitHub runner left.)
  smoke-test-musl:
    name: Install ${{ matrix.target.platform }} gem on Ruby ${{ matrix.ruby }} (Alpine)
    needs: cross-gem
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-latest, platform: x86_64-linux-musl, docker: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux-musl, docker: linux/arm64 }
        ruby: ["3.3", "3.4", "4.0"]
        include:
          - target: { os: ubuntu-latest, platform: arm-linux-musl, docker: linux/arm/v7, qemu: true }
            ruby: "3.4"
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gem-${{ matrix.target.platform }}
          path: pkg

      - if: matrix.target.qemu
        uses: docker/setup-qemu-action@v4

      - name: Install and use the gem
        run: |
          docker run --rm --platform ${{ matrix.target.docker }} -v "$PWD/pkg:/pkg" ruby:${{ matrix.ruby }}-alpine sh -c '
            gem install /pkg/*.gem --no-document &&
            cd /tmp && ruby -e "
              require %q(calx)
              File.write(%q(smoke.csv), %Q(a,b\n1,2\n))
              abort %q(wrong rows) unless Calx.read(%q(smoke.csv)) == [%w[a b], %w[1 2]]
              puts %Q(calx #{Calx::VERSION} OK on #{RUBY_PLATFORM}, Ruby #{RUBY_VERSION})
            "
          '

  publish:
    name: Publish to RubyGems and GitHub Packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-gem, cross-gem, smoke-test, smoke-test-musl]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # GitHub Packages
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"

      - name: Check tag matches Calx::VERSION
        run: |
          version=$(ruby -Ilib -e 'require "calx/version"; print Calx::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Calx::VERSION ${version}"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true

      - run: ls -l pkg

      # GitHub Packages goes first, with only its own token. gem push prefers
      # GEM_HOST_API_KEY over --key, so once the RubyGems credentials below are
      # configured they would be sent to whichever host is pushed to.
      # GitHub Packages keeps one gem per version (it rejects a second platform
      # gem as "already pushed"), so only the source gem goes there; installing
      # from it compiles the extension and needs a Rust toolchain.
      - name: Push to GitHub Packages
        # A GitHub Packages problem must not stop the RubyGems release below.
        continue-on-error: true
        env:
          GEM_HOST_API_KEY: Bearer ${{ secrets.GITHUB_TOKEN }}
        run: gem push --host "https://rubygems.pkg.github.com/${GITHUB_REPOSITORY_OWNER}" "pkg/calx-${GITHUB_REF_NAME#v}.gem"

      # What rubygems/configure-rubygems-credentials does, plus `owner`: RubyGems
      # needs it to create a new gem by trusted publishing, and the action (v2.1.0)
      # can't pass it yet. 98290 is the owning RubyGems.org account's ID.
      - name: Exchange the OIDC token for a RubyGems API key
        run: |
          jwt=$(curl -sS --fail-with-body -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::${jwt}"
          res=$(jq -n --arg jwt "$jwt" '{jwt: $jwt, owner: "98290"}' |
            curl -sS -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
              -H "content-type: application/json" -H "accept: application/json" --data @-)
          key=$(jq -r '.rubygems_api_key // empty' <<<"$res")
          if [ -z "$key" ]; then echo "::error::No API key returned: ${res}"; exit 1; fi
          echo "::add-mask::${key}"
          echo "GEM_HOST_API_KEY=${key}" >> "$GITHUB_ENV"

      - name: Push to RubyGems
        run: for gem in pkg/*.gem; do gem push "$gem"; done
