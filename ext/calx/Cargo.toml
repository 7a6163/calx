[package]
name = "calx"
version = "0.1.0"
edition = "2021"
authors = ["Zac <579103+7a6163@users.noreply.github.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
calamine = "0.38.0"
csv = "1.4.0"
magnus = { version = "0.9", features = ["rb-sys"] }
rb-sys = { version = "0.9", features = ["stable-api-compiled-fallback"] }

[build-dependencies]
rb-sys-env = "0.2.2"
